# Config for the `keybind` scenario. Bare (unmodified) binds so the test can press them
# through the virtual keyboard without a modifier dance.
#
# The keysyms are what the default keymap actually produces for the raw evdev codes the
# scenario injects — 183/184 are XF86Tools/XF86Launch5, NOT F13/F14. Naming a keysym the
# keymap never emits parses fine and simply never fires, which looks exactly like a broken
# bind dispatcher.
#
# Both actions are chosen to leave keyboard focus alone. An action that moves focus (a
# workspace switch, say) makes "did the client see this key?" unanswerable, because after it
# runs there is no focused client for the release to reach either way.

# Observable over IPC as windows[].fullscreen, and it does not move focus.
bind  = , XF86Tools, fullscreen
# A repeating bind whose effect ACCUMULATES, so "is the repeat still running?" is a question
# about a file that grows rather than about focus that may happen to land back where it was.
binde = , XF86Launch5, exec, sh -c 'echo x >> /tmp/fenriz-test-repeat'
