# Config for the `tearing` scenario. Without `tearing = true` the compositor's policy gate is
# shut before it ever looks at a client's hint, and every assertion in the scenario would pass
# for the wrong reason.
tearing      = true
# Animations schedule frames on their own, which would hide an output that has stopped
# committing — the exact failure the scenario's frame-callback counting is there to catch.
animation_ms = 0
