# Config for the `flip-blur` scenario, which asserts against a screenshot.
#
#   gaps/border 0  — the backdrop is the whole output, with nothing subtracted
#   rounding 0     — no corner cut into the region being measured
#   shadow off     — the glow is drawn inside the frame, but leave nothing to argue about
#   animation 0    — a window still sliding into place would be captured mid-flight
#   blur on        — the point of the scenario
#   flip 5000      — long enough that pumping between captures lands mid-turn reliably
#
# The pair floats so it sits over the striped backdrop rather than beside it: a tiled pair
# would narrow into bare desktop, where a blur has nothing to flatten and nothing shows.
gaps         = 0
border_width = 0
rounding     = 0
shadow       = false
animation    = 0
opacity      = 1.0
blur         = on
flip         = 5000
windowrule = name=flip-blur-pair, title=.*flip-blur-[ab].*, float=true, center=true
