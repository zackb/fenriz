# Config for the `rule-geom` scenario
# No gaps, border, rounding, shadow or animation, so the float's edges land on exact pixels.
gaps         = 0
border_width = 0
rounding     = 0
shadow       = false
animation    = 0
blur         = false
opacity      = 1.0

# center is overridden by position; the client asks for 300x220 and must be resized.
windowrule = name=rule-geom, title=.*rule-geom-float.*, float=true, center=true, size=400x200, position=100x50
