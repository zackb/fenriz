# Config for the `ws-fade` scenario, which samples the centre pixel through a workspace switch.
#
#   workspace_animation 800 — long enough to catch mid-fade between screenshots
#   animation 0             — no slide moving the window under the sampled pixel
#   opacity 1.0             — the window colours are exact when settled
workspace_animation = 800
animation           = 0
opacity             = 1.0
