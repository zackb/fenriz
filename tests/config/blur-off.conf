# Config for the `blur-off` scenario: the other half of the feature. With blur disabled the
# compositor must say so through the capability set, so clients fall back to plain translucency
# instead of asking for an effect that will never appear.
blur         = false
animation_ms = 0
gaps         = 0
border_width = 0
rounding     = 0
shadow       = false
opacity      = 1.0
