# Config for the `pixels` scenario, which asserts against a screenshot rather than protocol
# traffic. Everything that would move a window or soften an edge is pinned so the expected
# coordinates are exact:
#
#   gaps/border 0  — the tiled window is the whole output, so its pixels are the output's
#   animation 0    — a window still sliding into place would be captured mid-flight
#   shadow off     — no soft falloff bleeding into the pixels being sampled
#   rounding 24    — the point of the corner assertions
#   blur on        — a blur node is a rectangle, and the corner checks are what catch it
#                    painting over the rounding (which is exactly what shipped broken once)
gaps         = 0
border_width = 0
rounding     = 24
shadow       = false
animation_ms = 0
blur         = true
opacity      = 1.0

# The floating window is centred, over the middle of the tiled one — away from the screen
# corners, where the tiled window's own rounding would leave the desktop showing instead of a
# solid colour behind the float's corner.
windowrule = name=pixels-float, title=.*pixels-float.*, float=true, center=true
