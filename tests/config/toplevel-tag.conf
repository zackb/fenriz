# Config for the `toplevel-tag` scenario (wltest.sh copies it in as the instance's whole
# config; everything not set here is the compiled-in default).
#
# This rule is the one link between xdg-toplevel-tag-v1 and the window rules that a unit test
# cannot reach: match_rules is pure and tested in test_config.cpp, view_tag() is proven by the
# IPC feed, but "apply_window_rules passes the tag as the tag" needs a live compositor holding
# a real config. It doubles as the proof that a test instance reads THIS file and not the
# user's ~/.config/fenriz/fenriz.conf — the rule exists nowhere else.
windowrule = name=tagged-settings, tag=^settings$, float=true
