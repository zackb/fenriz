# Config for the `flip` scenario, which asserts against a screenshot. Everything that would
# move a window, soften an edge or resize it late is pinned so the colour bands it measures
# have exact widths:
#
#   gaps/border 0  — a tile's pixels are the tile's, with nothing subtracted
#   rounding 0     — no corner cut into the bands being counted
#   shadow off     — no soft falloff reading as a third colour
#   animation 0    — a window still sliding into place would be captured mid-flight
#   flip 120       — a real turn (0 would take the instant path and never exercise the
#                    capture/release the scale depends on), short enough to settle inside
#                    the scenario's pump
gaps         = 0
border_width = 0
rounding     = 0
shadow       = false
animation    = 0
opacity      = 1.0
flip         = 120
