# Config for the `flip-persp` scenario, which measures the edges of a turning window.
#
#   gaps/border 0, rounding 0 — the window's own colour runs to its edges
#   shadow off, animation 0   — nothing else moves or bleeds into the measured columns
#   flip 3000                 — slow enough to sample both faces mid-turn
gaps         = 0
border_width = 0
rounding     = 0
shadow       = false
animation    = 0
opacity      = 1.0
flip         = 3000
