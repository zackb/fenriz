name: build

on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string
      release:
        description: Also build the release preset, which strips asserts.
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    container: ${{ inputs.image }}
    steps:
      - name: bootstrap git
        run: |
          . /etc/os-release
          case ${ID_LIKE:-$ID} in
            *arch*)        pacman -Sy --noconfirm --needed git ;;
            *fedora*)      dnf install -y git ;;
            *debian*|*ubuntu*) apt-get update && apt-get install -y --no-install-recommends git ca-certificates ;;
          esac

      - uses: actions/checkout@v4

      - name: dependencies
        run: ./scripts/ci-deps.sh

      - name: build (debug)
        run: |
          cmake --preset debug
          cmake --build --preset debug

      # `make test-wl` is deliberately absent. Runners have no /dev/dri
      #     docker run --device /dev/dri ... ./scripts/wltest.sh
      - name: unit tests
        run: ctest --test-dir build/debug --output-on-failure -LE integration

      - name: build (release)
        if: inputs.release
        run: |
          cmake --preset release
          cmake --build --preset release
